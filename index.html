<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旺林｜LINE 圖文選單設計工具</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#fff6d8,#ffd19b);font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#754419;padding:18px}.card{background:#fffdf7;width:min(460px,100%);padding:38px;border-radius:24px;box-shadow:0 20px 55px #bb752626;text-align:center}h1{font-size:27px}p{line-height:1.7;color:#946f4c}input,button{width:100%;padding:15px;margin:7px 0;border-radius:12px;font-size:16px}input{border:1px solid #e6c59b}button{border:0;background:#e98b30;color:#fff;font-weight:700;cursor:pointer}#error{color:#b13d43;min-height:24px}body{background:linear-gradient(135deg,#faf9f5,#f1eee7);color:#514f49}.card{background:#fffefa;box-shadow:0 18px 48px #4e493b15;border:1px solid #e9e5dc}p{color:#817d73}input{border-color:#dedad1;background:#fffefa}button{background:#817d70;color:#fff}button:hover{background:#6e6a5e}</style></head><body><main class="card"><div style="font-size:42px">🌿</div><h1>旺林 LINE 圖文選單設計工具</h1><p>學員輸入老師事先登記的 Email，即可開始設計。<br>不需要密碼，也不需要個人專屬連結</p><form id="login"><input id="email" type="email" placeholder="學員 Email／管理員 Email" autocomplete="username" required><div id="adminPassword" style="display:none"><input id="password" type="password" placeholder="管理員密碼" autocomplete="current-password"></div><button id="submit">開始設計</button></form><div id="error" role="alert"></div></main><script>fetch('/api/session',{cache:'no-store'}).then(r=>{if(r.ok)location.replace('/tool')}).catch(()=>{});document.getElementById('email').addEventListener('input',()=>{const admin=document.getElementById('email').value.trim().toLowerCase()==='vvvv68224@gmail.com';document.getElementById('adminPassword').style.display=admin?'block':'none';document.getElementById('password').required=admin;document.getElementById('submit').textContent=admin?'管理員登入':'開始設計'});document.getElementById('login').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;document.getElementById('error').textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'登入失敗');location.replace('/tool')}catch(err){document.getElementById('error').textContent=err.message;btn.disabled=false}};</script></body></html>

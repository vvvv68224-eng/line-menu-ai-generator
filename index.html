<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旺林工作室～官方LINE實戰教學</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#fff6d8,#ffd19b);font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#754419;padding:18px}.card{background:#fffdf7;width:min(460px,100%);padding:38px;border-radius:24px;box-shadow:0 20px 55px #bb752626;text-align:center}h1{font-size:27px}p{line-height:1.7;color:#946f4c}input,button{width:100%;padding:15px;margin:7px 0;border-radius:12px;font-size:16px}input{border:1px solid #e6c59b}button{border:0;background:#e98b30;color:#fff;font-weight:700;cursor:pointer}#error{color:#b13d43;min-height:24px}body{background:linear-gradient(135deg,#faf9f5,#f1eee7);color:#514f49}.card{background:#fffefa;box-shadow:0 18px 48px #4e493b15;border:1px solid #e9e5dc}p{color:#817d73}input{border-color:#dedad1;background:#fffefa}button{background:#817d70;color:#fff}button:hover{background:#6e6a5e}.card{width:min(680px,100%);padding:26px 30px 32px;text-align:left;border-radius:25px}.studio-logo{color:#577267;letter-spacing:.14em;font-size:13px;margin:4px 0 19px}.studio-visual{min-height:230px;padding:27px 30px;background:linear-gradient(120deg,#e7e8dd 0 54%,#c2d1c1 54% 72%,#e9d9c7 72%);border-radius:17px;display:flex;flex-direction:column;justify-content:space-between;color:#294e40}.studio-visual-eyebrow{font-size:12px;letter-spacing:.24em}.studio-visual-title{font-size:clamp(22px,3.6vw,32px);font-weight:800;line-height:1.5;letter-spacing:.04em}.studio-visual-mark{font-size:12px;color:#526c5b}.card h1{font-size:24px;margin:24px 0 4px}.card p{font-size:15px;color:#6b766d}.card button{background:#2c654f}.card button:hover{background:#214e3e}.studio-divider{border-top:1px solid #e7e7de;margin:24px 0 16px}.studio-small{font-weight:700}.card [hidden]{display:none!important}@media(max-width:550px){.card{padding:18px}.studio-visual{min-height:205px;padding:21px}.studio-visual-mark{font-size:10px}} </style></head><body><main class="card"><div class="studio-logo">旺林工作室～官方LINE實戰教學</div><div class="studio-visual"><span class="studio-visual-eyebrow">DESIGN YOUR LINE</span><span class="studio-visual-title">把你的品牌想法，<br>變成有質感的 LINE 設計。</span><span class="studio-visual-mark">✦　設計圖文選單　·　編輯自動回覆　·　歡迎訊息</span></div><h1>歡迎來到旺林工作室～官方LINE實戰教學</h1><p>老師已開通的學員，輸入 Email 即可開始設計，不需要密碼。</p><div id="loginPanel"><div class="studio-divider"></div><p class="studio-small">學員 Email 驗證｜不用密碼</p><form id="login"><input id="email" type="email" placeholder="輸入老師已開通的 Email" autocomplete="username" required><div id="adminPassword" style="display:none"><input id="password" type="password" placeholder="管理員密碼" autocomplete="current-password"></div><button id="submit">進入工作室 →</button></form><div id="error" role="alert" aria-live="polite"></div></div></main><script>fetch('/api/session',{cache:'no-store'}).then(r=>{if(r.ok)location.replace('/tool')}).catch(()=>{});document.getElementById('email').addEventListener('input',()=>{const admin=document.getElementById('email').value.trim().toLowerCase()==='vvvv68224@gmail.com';document.getElementById('adminPassword').style.display=admin?'block':'none';document.getElementById('password').required=admin;document.getElementById('submit').textContent=admin?'管理員登入':'開始設計'});document.getElementById('login').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;btn.textContent='正在確認權限，請稍候…';document.getElementById('error').textContent='首次進入可能需要幾秒鐘，請勿重複點擊。';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'登入失敗');location.replace('/tool')}catch(err){document.getElementById('error').textContent=err.message;btn.disabled=false;btn.textContent='開始設計'}};</script></body></html>

<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>旺林｜LINE 圖文選單設計工具</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(130deg,#e9f3ef,#f9f4ea);font-family:system-ui,"Microsoft JhengHei",sans-serif;color:#264d46;padding:18px}.card{background:white;width:min(460px,100%);padding:38px;border-radius:24px;box-shadow:0 20px 55px #193c2b1a;text-align:center}h1{font-size:27px}p{line-height:1.7;color:#687c74}input,button{width:100%;padding:15px;margin:7px 0;border-radius:12px;font-size:16px}input{border:1px solid #c8d8d1}button{border:0;background:#2f625c;color:#fff;font-weight:700;cursor:pointer}#error{color:#b13d43;min-height:24px}</style></head><body><main class="card"><div style="font-size:42px">🌿</div><h1>旺林 LINE 圖文選單設計工具</h1><p>AI 創意設計 × 一鍵快速製圖<br>請使用管理員提供的學員帳號登入</p><form id="login"><input id="email" type="email" placeholder="Email 電子郵件" autocomplete="username" required><input id="password" type="password" placeholder="密碼" autocomplete="current-password" required minlength="8"><button id="submit">登入設計工具</button></form><div id="error" role="alert"></div></main><script>fetch('/api/session',{cache:'no-store'}).then(r=>{if(r.ok)location.replace('/tool')}).catch(()=>{});document.getElementById('login').onsubmit=async e=>{e.preventDefault();const btn=document.getElementById('submit');btn.disabled=true;document.getElementById('error').textContent='';try{const r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:document.getElementById('email').value,password:document.getElementById('password').value})});const d=await r.json();if(!r.ok)throw Error(d.error||'登入失敗');location.replace(d.role==='admin'?'/admin':'/tool')}catch(err){document.getElementById('error').textContent=err.message;btn.disabled=false}};</script></body></html>

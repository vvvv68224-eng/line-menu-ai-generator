<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINE 官方圖文選單 GPT 指令產生器</title><style>body{margin:0;background:#f7f5ef;color:#3e403f;font-family:Arial,"Microsoft JhengHei",sans-serif}.wrap{max-width:980px;margin:auto;padding:22px 16px}.hero,.card{background:#fff;border:1px solid #dfe7e5;border-radius:22px;padding:24px;margin:14px 0;box-shadow:0 4px 18px rgba(47,91,90,.06)}h1{font-size:32px;line-height:1.3;margin:10px 0}h2{font-size:23px;margin:0 0 16px}.lead{font-size:18px;line-height:1.7}.tag{display:inline-block;background:#dcefed;color:#2f6867;padding:7px 14px;border-radius:99px;font-weight:700}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}label{display:block;font-size:17px;font-weight:700;margin-bottom:6px}input,select{width:100%;padding:14px 13px;font-size:17px;border:1px solid #cfdcda;border-radius:12px;box-sizing:border-box;margin-bottom:12px;background:#fff}.chips{display:flex;gap:9px;flex-wrap:wrap}.chip,button{border:0;border-radius:12px;padding:12px 16px;cursor:pointer;font-weight:700;font-size:16px}.chip{background:#e8f1ef;color:#356b69}.chip.active{background:#4f8f8d;color:#fff}.primary{background:#397d7b;color:#fff}.ghost{background:#e7eeee;color:#356b69}.row{display:grid;grid-template-columns:78px 1fr;gap:10px;align-items:center;margin:10px 0}.num{text-align:center;background:#eaf2f0;border-radius:10px;padding:13px 5px;font-weight:700;font-size:16px}.notice{background:#f1f7f6;border-left:5px solid #5b9996;padding:14px 16px;border-radius:10px;font-size:16px;line-height:1.7}pre{white-space:pre-wrap;background:#243837;color:#f8ffff;padding:20px;border-radius:14px;line-height:1.8;font-size:16px}.actions{display:flex;gap:10px;flex-wrap:wrap}.small{font-size:16px;line-height:1.7}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{grid-template-columns:64px 1fr}h1{font-size:28px}}</style></head><body><div class="wrap"><div class="hero"><span class="tag">教學工具｜GPT 圖像生成</span><h1>LINE 官方圖文選單<br>GPT 指令產生器</h1><p class="lead">填寫你的品牌資料，產生一段可以直接交給 <b>GPT</b> 生成圖像的完整指令。</p><div class="notice">📌 固定規格：<b>2500 × 1686 px｜橫式｜下面最多 3 格</b><br>不使用 Canva AI，產生的是「給 GPT 使用」的圖像設計指令。</div></div><div class="card"><h2>① 我的品牌</h2><div class="grid"><div><label>品牌／店家名稱</label><input id="brand" placeholder="例如：昱見"></div><div><label>主要色系</label><input id="colors" placeholder="例如：淡藍綠、米白"></div><div><label>品牌風格</label><input id="style" placeholder="例如：專業、質感、簡約"></div><div><label>希望呈現的感覺</label><input id="feeling" placeholder="例如：值得信賴、穩重"></div><div><label>目標客戶</label><input id="audience" placeholder="例如：想學營養命理的人"></div></div></div><div class="card"><h2>② 我的行業</h2><div class="chips" id="chips"><button class="chip" data-v="教育／講師">教育／講師</button><button class="chip" data-v="美容／身心">美容／身心</button><button class="chip" data-v="餐飲／食品">餐飲／食品</button><button class="chip" data-v="零售／電商">零售／電商</button><button class="chip" data-v="專業服務">專業服務</button><button class="chip" data-v="個人品牌／自由工作者">個人品牌</button><button class="chip" data-v="其他">其他</button></div><input id="other" placeholder="若選擇其他，請輸入你的行業"></div><div class="card"><h2>③ 我的圖文選單</h2><p class="small">最多只能放 <b>3 格</b>。你可以自己輸入最重要的三個功能。</p><div id="menus"></div></div><div class="card"><div class="actions"><button class="primary" onclick="generate()">✨ 產生 GPT 圖像指令</button><button class="ghost" onclick="example()">填入範例</button></div></div><div class="card" id="result" style="display:none"><h2>④ 複製指令 → 貼給 GPT</h2><pre id="out"></pre><div class="actions"><button class="primary" onclick="copyIt()">📋 一鍵複製</button></div><p id="msg" style="display:none">✅ 已複製，可以貼到 GPT 使用。</p></div></div><script>const defaults={"教育／講師":["關於我","課程介紹","課程報名"],"美容／身心":["服務項目","預約服務","最新優惠"],"餐飲／食品":["菜單／商品","線上訂購","門市資訊"],"零售／電商":["商品目錄","最新優惠","客服中心"],"專業服務":["關於我","服務介紹","預約諮詢"],"個人品牌／自由工作者":["關於我","我的服務","聯絡／預約"],"其他":["關於我","服務介紹","聯絡我們"]};let industry="教育／講師";document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');industry=b.dataset.v==='其他'?(document.getElementById('other').value||'其他'):b.dataset.v;render()});function render(){let a=defaults[industry]||defaults.其他;menus.innerHTML='';for(let i=0;i<3;i++)menus.innerHTML+=`<div class="row"><div class="num">第 ${i+1} 格</div><input class="mi" placeholder="例如：${a[i]||'功能名稱'}" value="${a[i]||''}"></div>`}function generate(){let brand=brandEl(),colors=val('colors','淡雅、專業色系'),style=val('style','專業、簡約'),feeling=val('feeling','值得信賴'),audience=val('audience','＿＿＿＿＿＿'),otherText=val('other',''),ind=industry==='其他'&&otherText?otherText:industry,ms=[...document.querySelectorAll('.mi')].map(x=>x.value.trim()).filter(Boolean);out.textContent=`請使用 GPT 的圖像生成能力，直接設計一張「LINE 官方帳號大型圖文選單」，不要使用 Canva AI，也不要輸出 Canva 操作教學。\n\n【一、畫布規格】\n尺寸：2500 × 1686 px\n版型：橫式、寬幅、高解析度\n用途：LINE 官方帳號大型圖文選單\n請確保整體比例為橫向寬幅，不要做成直式海報。\n\n【二、品牌資料】\n品牌／店家名稱：${brand}\n行業：${ind}\n目標客戶：${audience}\n品牌風格：${style}\n主要色系：${colors}\n希望呈現的感覺：${feeling}\n\n【三、版面配置】\n請將畫面設計成「上方品牌主視覺＋下方最多三格功能選單」的橫式版型。\n上方約 65～70% 放品牌名稱、簡短品牌定位與符合行業的主視覺；下方約 30～35% 放三個清楚分隔的功能區。\n下方只能有 3 格，不要增加第 4 格。三格寬度平均分配，手機上也要容易辨識。\n\n【四、三個功能】\n1. ${ms[0]||'＿＿＿＿＿＿'}\n2. ${ms[1]||'＿＿＿＿＿＿'}\n3. ${ms[2]||'＿＿＿＿＿＿'}\n\n【五、文字與視覺要求】\n所有文字使用繁體中文。主標題清楚、有品牌感；下方三格的功能文字請「比一般小字更大、更粗、更清楚」，即使在手機畫面也能快速閱讀。不要使用過小的輔助文字。\n每格搭配簡潔、符合功能的圖示；圖示不要搶過文字。\n整體專業、乾淨、有留白，不要塞滿元素，不要使用過度可愛或廉價的裝飾。\n請依照品牌與行業客製化視覺，不要套用制式模板。\n\n【六、最重要的限制】\n這是一張「橫式 LINE 大型圖文選單」，不是 IG 貼文、不是直式海報。\n下方最多 3 格，固定為 3 格。\n功能文字必須大、清楚、容易閱讀。\n請直接生成完成的圖像，不要只提供設計說明。`;result.style.display='block';result.scrollIntoView({behavior:'smooth'})}function val(id,fallback){let x=document.getElementById(id).value.trim();return x||fallback}function brandEl(){return val('brand','＿＿＿＿＿＿')}function copyIt(){navigator.clipboard.writeText(out.textContent);msg.style.display='block'}function example(){document.getElementById('brand').value='昱見';document.getElementById('colors').value='淡藍綠、米白';document.getElementById('style').value='專業、簡約、質感';document.getElementById('feeling').value='值得信賴、穩重';document.getElementById('audience').value='想學營養命理的人';industry='教育／講師';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.v===industry));render()}render()</script></body></html>

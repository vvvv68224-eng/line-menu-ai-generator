<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>LINE 官方圖文選單 AI 指令產生器</title><style>body{margin:0;background:#fbf8f2;color:#4a342b;font-family:Arial,"Microsoft JhengHei",sans-serif}.wrap{max-width:900px;margin:auto;padding:24px 16px}.card{background:#fffdf9;border:1px solid #eadfd5;border-radius:22px;padding:22px;margin:14px 0}h1{font-size:30px}h2{font-size:20px}input,select{width:100%;padding:12px;border:1px solid #dfd1c7;border-radius:12px;box-sizing:border-box;margin:5px 0 12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.chips{display:flex;gap:8px;flex-wrap:wrap}.chip,button{border:0;border-radius:12px;padding:11px 15px;cursor:pointer;font-weight:700}.chip{background:#eee7f3;color:#5d477c}.chip.active{background:#76599b;color:white}.primary{background:#d95c7a;color:white}.ghost{background:#eee7f3;color:#5d477c}pre{white-space:pre-wrap;background:#302923;color:#fffaf5;padding:18px;border-radius:14px;line-height:1.7}.row{display:grid;grid-template-columns:100px 1fr;gap:8px;align-items:center;margin:8px 0}.num{text-align:center;background:#f6eee9;border-radius:10px;padding:11px;font-weight:bold}@media(max-width:650px){.grid{grid-template-columns:1fr}.row{grid-template-columns:70px 1fr}}.tag{display:inline-block;background:#f6dce5;color:#a74461;padding:6px 12px;border-radius:99px;font-weight:bold}</style></head><body><div class="wrap"><div class="card"><span class="tag">教學工具｜可重複使用</span><h1>LINE 官方圖文選單<br>AI 指令產生器</h1><p>填寫品牌資料與功能，自動整理成可以直接貼給 Canva AI 的設計指令。</p></div><div class="card"><h2>① 我的品牌</h2><div class="grid"><div><b>品牌／店家名稱</b><input id="brand" placeholder="例如：妤你一起"></div><div><b>主要色系</b><input id="colors" placeholder="例如：米白、淡紫、粉色"></div><div><b>品牌風格</b><input id="style" placeholder="例如：溫柔、專業、日系"></div><div><b>希望呈現的感覺</b><input id="feeling" placeholder="例如：溫暖、值得信任"></div></div></div><div class="card"><h2>② 我的行業</h2><div class="chips" id="chips"><button class="chip" data-v="教育／講師">👩‍🏫 教育／講師</button><button class="chip" data-v="美容／身心">💆‍♀️ 美容／身心</button><button class="chip" data-v="餐飲／食品">🍰 餐飲／食品</button><button class="chip" data-v="零售／電商">🛍️ 零售／電商</button><button class="chip" data-v="專業服務">🏠 專業服務</button><button class="chip" data-v="個人品牌／自由工作者">💼 個人品牌</button><button class="chip" data-v="其他">✏️ 其他</button></div><input id="other" placeholder="選擇其他時，請輸入你的行業"></div><div class="card"><h2>③ LINE 選單</h2><div class="grid"><div><b>選單數量</b><select id="count"><option>3</option><option>4</option><option>5</option><option selected>6</option></select></div><div><b>目標客戶</b><input id="audience" placeholder="例如：新手爸媽"></div></div><div id="menus"></div></div><div class="card"><button class="primary" onclick="generate()">✨ 產生我的 AI 指令</button> <button class="ghost" onclick="example()">填入範例</button></div><div class="card" id="result" style="display:none"><h2>④ 複製指令 → 貼到 Canva AI</h2><pre id="out"></pre><button class="primary" onclick="copyIt()">📋 一鍵複製</button><p id="msg" style="display:none">已複製，可以貼到 Canva AI 了！</p></div></div><script>const s={"教育／講師":["關於我","課程介紹","課程報名","目前課表","學員專區","預約諮詢"],"美容／身心":["服務項目","價目表","預約","優惠活動","作品集","聯絡我們"],"餐飲／食品":["菜單","線上訂購","門市資訊","最新優惠","會員專區","聯絡我們"],"零售／電商":["商品目錄","最新優惠","購物須知","訂單查詢","會員專區","客服中心"],"專業服務":["認識我","服務項目","成功案例","預約諮詢","客戶見證","聯絡方式"],"個人品牌／自由工作者":["關於我","我的服務","最新內容","課程","預約","VIP／會員"],"其他":["關於我","服務介紹","最新消息","優惠活動","預約／訂購","聯絡我們"]};let industry="其他";document.querySelectorAll('.chip').forEach(b=>b.onclick=()=>{document.querySelectorAll('.chip').forEach(x=>x.classList.remove('active'));b.classList.add('active');industry=b.dataset.v==='其他'?(document.getElementById('other').value||'其他'):b.dataset.v;render()});document.getElementById('count').onchange=render;function render(){let n=+count.value,a=s[industry]||s.其他;menus.innerHTML='';for(let i=0;i<n;i++)menus.innerHTML+=`<div class="row"><div class="num">功能 ${i+1}</div><input class="mi" placeholder="例如：${a[i]||'服務介紹'}" value="${a[i]||''}"></div>`}function generate(){let brand=document.getElementById('brand').value||'＿＿＿＿＿＿',colors=document.getElementById('colors').value||'＿＿＿＿＿＿',style=document.getElementById('style').value||'＿＿＿＿＿＿',feeling=document.getElementById('feeling').value||'＿＿＿＿＿＿',audience=document.getElementById('audience').value||'＿＿＿＿＿＿',ms=[...document.querySelectorAll('.mi')].map(x=>x.value).filter(Boolean);out.textContent=`請幫我設計一張「LINE 官方帳號大型圖文選單」。\n\n一、尺寸\n請使用 2500 × 1686 px，橫式、高解析度，適合 LINE 官方帳號大型圖文選單。\n\n二、品牌資料\n品牌／店家名稱：${brand}\n行業：${industry}\n目標客戶：${audience}\n品牌風格：${style}\n主要色系：${colors}\n希望呈現的感覺：${feeling}\n\n三、LINE 選單功能\n${ms.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\n四、設計要求\n請依照我的行業、品牌風格與目標客戶設計，不要套用制式模板。每個功能區要有清楚視覺區隔，文字使用繁體中文且容易閱讀。圖示依功能選擇適合的圖像。整體兼具品牌感、專業度與操作直覺性，避免文字過多與裝飾過度，保留適當留白，讓手機畫面也能快速辨識各功能。請自動安排最適合的版面、圖示、字級與視覺層級。`;result.style.display='block';result.scrollIntoView({behavior:'smooth'})}function copyIt(){navigator.clipboard.writeText(out.textContent);msg.style.display='block'}function example(){brand.value='妤你一起';colors.value='米白、淡紫、粉色、暖橘';style.value='溫柔、專業、日系、簡約';feeling.value='溫暖、值得信任、好親近';audience.value='需要親子與關係陪伴的家庭';industry='教育／講師';document.querySelectorAll('.chip').forEach(x=>x.classList.toggle('active',x.dataset.v===industry));render()}render()</script></body></html>
